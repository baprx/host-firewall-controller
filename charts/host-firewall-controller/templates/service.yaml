{{- if and .Values.metrics.enabled .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hfc.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hfc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.metrics.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "hfc.selectorLabels" . | nindent 4 }}
{{- end }}
