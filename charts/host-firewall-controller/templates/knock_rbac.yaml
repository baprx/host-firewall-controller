{{- if and .Values.knock.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hfc.fullname" . }}-knock-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hfc.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hfc.fullname" . }}-knock-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hfc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hfc.fullname" . }}-knock-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "hfc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
