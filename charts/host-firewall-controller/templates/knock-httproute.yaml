{{- if and .Values.knock.enabled .Values.knock.httpRoute.enabled }}
{{- if not .Values.knock.service.enabled }}
{{- fail "knock.httpRoute.enabled requires knock.service.enabled" }}
{{- end }}
{{- if not .Values.knock.httpRoute.parentRefs }}
{{- fail "knock.httpRoute.enabled requires at least one knock.httpRoute.parentRefs entry" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hfc.fullname" . }}-knock
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hfc.labels" . | nindent 4 }}
  {{- with .Values.knock.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.knock.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.knock.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "hfc.fullname" $ }}-knock
          port: {{ $.Values.knock.port }}
      {{- with .Values.knock.httpRoute.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
