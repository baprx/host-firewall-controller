# Default values for host-firewall-controller.
#
# The chart installs one privileged DaemonSet pod per node. Each pod manages the
# UFW rules of its own node only.

# @schema additionalProperties: false
# -- Container image settings.
image:
  # @schema minLength: 1
  # -- Container image repository.
  repository: ghcr.io/baprx/host-firewall-controller
  # -- Container image tag. Defaults to .Chart.AppVersion when empty.
  tag: ""
  # @schema enum: [Always, IfNotPresent, Never]
  # -- Container image pull policy.
  pullPolicy: IfNotPresent

# @schema item: object
# -- Secrets used to pull the image from a private registry.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full release name used in resource names.
fullnameOverride: ""

# @schema additionalProperties: {type: string}
# -- Nodes that receive the DaemonSet pods. Linux is required.
nodeSelector:
  kubernetes.io/os: linux

# @schema item: object
# -- Tolerations for the DaemonSet pods. The default runs on every node,
# including control planes.
tolerations:
  - operator: Exists

# -- Priority class of the DaemonSet pods.
priorityClassName: system-node-critical

# @schema pattern: ^/
# -- Path where the host root filesystem is mounted inside the pod.
hostRoot: /host

# @schema pattern: ^/
# -- Path of the ufw binary inside the host root.
ufwPath: /usr/sbin/ufw

# @schema pattern: ^([0-9]*[1-9][0-9]*(\.[0-9]+)?|0*\.[0-9]*[1-9][0-9]*)(ns|us|µs|ms|s|m|h)$
# -- How often orphaned rules are pruned from a node.
sweepInterval: 5m

# @schema pattern: ^[0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h)$
# -- Hostname refresh interval for rules that do not set
# spec.resolve.refreshInterval.
defaultRefreshInterval: 5m

# @schema pattern: ^[0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h)$
# -- Floor applied to per-rule refresh intervals.
minRefreshInterval: 30s

# @schema minimum: 1
# -- Stop converging on a node that would exceed this many managed rules.
maxRulesPerNode: 256

# @schema minimum: 1
# -- Maximum number of concrete rules one HostFirewallRule may expand to.
maxRulesPerCR: 64

# @schema minimum: 1; maximum: 64
# -- Maximum number of addresses used per hostname by default.
maxAddresses: 16

# -- Log the ufw commands instead of running them. Nothing is written to a host
# while this is true.
dryRun: false

# @schema item: string
# -- Extra raw flags appended to the manager.
extraArgs: []

# -- Host-wide ufw lock file. Defaults to <hostRoot>/run/host-firewall-controller.lock.
lockPath: ""

# @schema additionalProperties: {type: string}
# -- Annotations added to the DaemonSet pods.
podAnnotations: {}
# @schema additionalProperties: {type: string}
# -- Labels added to the DaemonSet pods.
podLabels: {}

# @schema additionalProperties: false
# -- DaemonSet rollout strategy.
updateStrategy:
  # @schema enum: [RollingUpdate, OnDelete]
  # -- Update strategy type.
  type: RollingUpdate
  # -- Rolling update settings.
  rollingUpdate:
    # @schema minimum: 0
    # -- Maximum number of pods unavailable during a rollout.
    maxUnavailable: 1

# @schema minimum: 0
# -- Time given to an in-flight ufw command before the pod is terminated.
terminationGracePeriodSeconds: 60

# -- Resource requests and limits for the manager container.
resources: {}

# -- Security context of the manager container. chroot and ufw require
# privileges, and ufw must write root-owned files inside the host root.
securityContext:
  # -- User ID the container runs as.
  runAsUser: 0
  # -- Group ID the container runs as.
  runAsGroup: 0
  # -- Run the container privileged.
  privileged: true
  # -- Allow the container to gain privileges.
  allowPrivilegeEscalation: true
  # -- Keep the container filesystem writable.
  readOnlyRootFilesystem: false

# @schema additionalProperties: false
# -- Health probe server settings.
healthProbe:
  # -- Address the health probe server binds to.
  bindAddress: ":8081"
  # @schema minimum: 1; maximum: 65535
  # -- Container port used by the probes.
  port: 8081

# @schema additionalProperties: false
# -- Prometheus metrics settings.
metrics:
  # -- Expose Prometheus metrics.
  enabled: true
  # -- Address the metrics server binds to.
  bindAddress: ":8080"
  # @schema minimum: 1; maximum: 65535
  # -- Container and Service port for metrics.
  port: 8080

  # @schema additionalProperties: false
  service:
    # -- Create a Service for the metrics endpoint.
    enabled: true
    # @schema enum: [ClusterIP, NodePort, LoadBalancer]
    # -- Service type.
    type: ClusterIP

  # @schema additionalProperties: false
  serviceMonitor:
    # -- Create a ServiceMonitor for the metrics Service.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # @schema additionalProperties: {type: string}
    # -- Extra labels for the ServiceMonitor.
    labels: {}

# @schema additionalProperties: false
# -- HTTP endpoint that lets a rule update its dynamic endpoint from the
# caller's source IP.
knock:
  # -- Expose the knock endpoint on every node.
  enabled: false
  # -- Address the knock server binds to.
  bindAddress: ":8082"
  # @schema minimum: 1; maximum: 65535
  # -- Host and container port for the knock endpoint. The chart does not add a
  # ufw rule for this port; allow it in the host firewall when the firewall is
  # default-deny.
  port: 8082
  # @schema item: string
  # -- CIDRs allowed to set X-Forwarded-For.
  trustedProxies: []

  # @schema additionalProperties: false
  # -- Service exposing the knock endpoint.
  service:
    # -- Create a Service for the knock endpoint.
    enabled: false
    # @schema enum: [ClusterIP, NodePort, LoadBalancer]
    # -- Service type.
    type: ClusterIP
    # @schema enum: [Cluster, Local]
    # -- Route traffic to node-local pods only. Local preserves the client
    # source IP, which is the address a knock allows. Only rendered for
    # NodePort and LoadBalancer Services.
    externalTrafficPolicy: Local
    # @schema additionalProperties: {type: string}
    # -- Annotations added to the knock Service.
    annotations: {}

  # @schema additionalProperties: false
  # -- Ingress exposing the knock endpoint. Mutually exclusive with
  # knock.httpRoute.
  ingress:
    # -- Create an Ingress for the knock Service.
    enabled: false
    # -- Ingress class name. Defaults to the cluster default class when empty.
    className: ""
    # @schema additionalProperties: {type: string}
    # -- Annotations added to the Ingress.
    annotations: {}
    # @schema item: object
    # -- Ingress hosts and their paths.
    hosts:
      - host: knock.example.com
        paths:
          - path: /
            pathType: Prefix
    # @schema item: object
    # -- TLS settings for the Ingress.
    tls: []

  # @schema additionalProperties: false
  # -- Gateway API ListenerSet that carries the knock listener. Enable it to
  # attach the HTTPRoute to a listener instead of attaching it to the Gateway
  # directly.
  listenerSet:
    # -- Create a ListenerSet for the knock Service.
    enabled: false
    # @schema additionalProperties: {type: string}
    # -- Annotations added to the ListenerSet, for example cert-manager and
    # external-dns annotations.
    annotations: {}
    # @schema additionalProperties: true
    # -- Parent Gateway reference of the ListenerSet, for example
    # {name: my-gateway, namespace: gateway-system}. The Gateway API defaults
    # group and kind when they are empty.
    parentRef: {}
    # @schema item: object
    # -- Listeners of the ListenerSet, as Gateway API listener objects. When
    # the HTTPRoute has no parentRefs, the chart attaches it to this
    # ListenerSet.
    listeners: []

  # @schema additionalProperties: false
  # -- Gateway API HTTPRoute exposing the knock endpoint. Mutually exclusive
  # with knock.ingress.
  httpRoute:
    # -- Create an HTTPRoute for the knock Service.
    enabled: false
    # @schema additionalProperties: {type: string}
    # -- Annotations added to the HTTPRoute.
    annotations: {}
    # @schema item: object
    # -- Gateway parent references. Defaults to the ListenerSet when
    # knock.listenerSet.enabled is true and this list is empty.
    parentRefs: []
    # @schema item: string
    # -- Hostnames the HTTPRoute matches.
    hostnames: []
    # @schema item: object
    # -- Matches for the HTTPRoute. The whole list forms one rule, so multiple
    # entries are ANDed by the Gateway API.
    matches:
      - path:
          type: PathPrefix
          value: /

# @schema additionalProperties: false
# -- ServiceAccount settings.
serviceAccount:
  # -- Create a ServiceAccount for the manager.
  create: true
  # -- ServiceAccount name. Defaults to the full release name when empty.
  name: ""
  # @schema additionalProperties: {type: string}
  # -- Annotations added to the ServiceAccount.
  annotations: {}

# @schema additionalProperties: false
# -- RBAC settings.
rbac:
  # -- Create the ClusterRole and ClusterRoleBinding.
  create: true

# @schema additionalProperties: {type: string}
# -- Labels added to every resource.
commonLabels: {}

# @schema item: object
# -- Arbitrary Kubernetes manifests appended to the release. Each item is a
# manifest map rendered with tpl, so it can reference release values and chart
# helpers with {{ ... }}.
extraObjects: []

# -- HostFirewallRule resources keyed by their name. Each value is the rule
# spec, passed through to the CRD verbatim, so any field the operator supports
# can be set here. A rule applies to every node unless its spec sets
# nodeSelector. Nothing is applied to a host while dryRun is true.
rules: {} # @schema additionalProperties: {$ref: ./rules.schema.yaml}
# Example, mirroring config/samples/security_v1alpha1_hostfirewallrule.yaml:
# rules:
#   allow-ssh-office:
#     action: allow
#     protocol: tcp
#     comment: SSH from the office
#     from:
#       cidr: 203.0.113.0/24
#     to:
#       ports: ["22"]
