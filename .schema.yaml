# Defaults for `helm schema`, run from the repository root by the pre-commit
# hook and by hand. values.yaml references rules.schema.yaml, so the generated
# schema embeds the rule definition.
values:
  - charts/host-firewall-controller/values.yaml
output: charts/host-firewall-controller/values.schema.json
draft: 7
indent: 2
bundle: true
# Use internal JSON pointers in $ref instead of $id: Helm's validator resolves
# the former and fails to load the latter as a relative file.
bundleWithoutID: true
useHelmDocs: true
noDefaultGlobal: true
schemaRoot:
  title: host-firewall-controller values
  additionalProperties: true
