name: Helm Chart

on:
  push:
    tags:
      - "host-firewall-controller-v*"
  pull_request:
    paths:
      - "charts/host-firewall-controller/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package and publish (tag, branch or SHA)
        required: true
        default: main
        type: string

permissions: {}

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chart:
    name: Package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Verify chart version matches the tag
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="${REF_NAME#host-firewall-controller-v}"
          actual="$(helm show chart charts/host-firewall-controller | awk '$1 == "version:" { print $2; exit }')"
          if [ "$actual" != "$expected" ]; then
            echo "Chart version '$actual' does not match tag '$REF_NAME'" >&2
            exit 1
          fi

      - name: Lint and render chart
        run: |
          helm lint charts/host-firewall-controller
          helm template host-firewall-controller charts/host-firewall-controller \
            --namespace host-firewall-system > /dev/null
          helm template host-firewall-controller charts/host-firewall-controller \
            --namespace host-firewall-system \
            --set metrics.enabled=false --set rbac.create=false --set serviceAccount.create=false > /dev/null

      - name: Package chart
        run: helm package charts/host-firewall-controller --destination dist

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push chart to GHCR
        if: github.event_name != 'pull_request'
        run: helm push dist/*.tgz oci://ghcr.io/baprx/charts
