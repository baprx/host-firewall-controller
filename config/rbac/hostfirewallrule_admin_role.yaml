# This rule is not used by the project host-firewall-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over security.baprx.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: host-firewall-controller
    app.kubernetes.io/managed-by: kustomize
  name: hostfirewallrule-admin-role
rules:
- apiGroups:
  - security.baprx.github.io
  resources:
  - hostfirewallrules
  verbs:
  - '*'
- apiGroups:
  - security.baprx.github.io
  resources:
  - hostfirewallrules/status
  verbs:
  - get
