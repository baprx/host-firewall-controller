---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - security.baprx.github.io
  resources:
  - hostfirewallrules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.baprx.github.io
  resources:
  - hostfirewallrules/status
  verbs:
  - get
  - patch
  - update
