# This rule is not used by the project host-firewall-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the security.baprx.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: host-firewall-controller
    app.kubernetes.io/managed-by: kustomize
  name: hostfirewallrule-editor-role
rules:
- apiGroups:
  - security.baprx.github.io
  resources:
  - hostfirewallrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.baprx.github.io
  resources:
  - hostfirewallrules/status
  verbs:
  - get
