# This rule is not used by the project host-firewall-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to security.baprx.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: host-firewall-controller
    app.kubernetes.io/managed-by: kustomize
  name: hostfirewallrule-viewer-role
rules:
- apiGroups:
  - security.baprx.github.io
  resources:
  - hostfirewallrules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.baprx.github.io
  resources:
  - hostfirewallrules/status
  verbs:
  - get
