apiVersion: security.baprx.github.io/v1alpha1
kind: HostFirewallRule
metadata:
  labels:
    app.kubernetes.io/name: host-firewall-controller
    app.kubernetes.io/managed-by: kustomize
  name: allow-ssh-office
spec:
  action: allow
  protocol: tcp
  comment: SSH from the office
  from:
    cidr: 203.0.113.0/24
  to:
    ports: ["22"]
