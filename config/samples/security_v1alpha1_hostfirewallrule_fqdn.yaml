apiVersion: security.baprx.github.io/v1alpha1
kind: HostFirewallRule
metadata:
  labels:
    app.kubernetes.io/name: host-firewall-controller
    app.kubernetes.io/managed-by: kustomize
  name: allow-egress-api
  namespace: default
spec:
  action: allow
  direction: out
  protocol: tcp
  comment: Egress to the internal API
  from:
    cidr: 10.0.0.0/8
  to:
    host: api.internal.example.com
    ports: ["443"]
  resolve:
    refreshInterval: 2m
    maxAddresses: 8
    ipFamilies: ["IPv4"]
