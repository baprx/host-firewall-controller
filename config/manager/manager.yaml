apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: host-firewall-controller
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: host-firewall-controller
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: host-firewall-controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: host-firewall-controller
    spec:
      # One pod per node: each pod manages only its own node's ufw rules.
      hostNetwork: true
      # Use the host resolver so hostname rules resolve like they would on the
      # node itself.
      dnsPolicy: Default
      serviceAccountName: controller-manager
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 60
      securityContext:
        # The manager chroots into the host root and execs the host ufw, so it
        # must run as root. The Helm chart sets the same securityContext.
        runAsUser: 0
        runAsGroup: 0
      containers:
      - name: manager
        image: controller:latest
        command:
        - /manager
        args:
        - --node-name=$(NODE_NAME)
        - --host-root=/host
        - --health-probe-bind-address=:8081
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: health
          containerPort: 8081
          protocol: TCP
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: host-root
          mountPath: /host
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
